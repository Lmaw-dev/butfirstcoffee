<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>But first, Coffee</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        .menu-header {
            position: relative;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero-badge-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 14px 0 10px;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.14);
            background: rgba(255,255,255,0.05);
            color: #f3f3f3;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .hero-badge::before {
            content: '';
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: linear-gradient(180deg, #f8d889, #c99224);
            box-shadow: 0 0 0 4px rgba(255, 214, 126, 0.12);
        }

        .featured-strip {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
            margin: 10px 0 16px;
        }

        .featured-card {
            display: grid;
            grid-template-columns: 78px 1fr;
            gap: 12px;
            align-items: center;
            padding: 10px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.04);
            border-radius: 10px;
        }

        .featured-card img {
            width: 78px;
            height: 62px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .featured-card h4 {
            margin: 0;
            color: #ffffff;
            font-size: 14px;
            line-height: 1.1;
        }

        .featured-card p {
            margin: 4px 0 0;
            color: #bcbcbc;
            font-size: 12px;
            line-height: 1.35;
        }

        .featured-card .price-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-top: 8px;
        }

        .featured-card .featured-price {
            color: #f3f3f3;
            font-weight: 700;
            font-size: 13px;
        }

        .featured-card .featured-add {
            border: 1px solid rgba(255,255,255,0.16);
            background: linear-gradient(180deg, #ececec 0%, #cfcfcf 100%);
            color: #111;
            border-radius: 999px;
            padding: 7px 11px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
        }

        .order-snapshot {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin: 0 0 12px;
        }

        .snapshot-chip {
            padding: 12px 14px;
            border-radius: 10px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .snapshot-chip span {
            display: block;
            color: #a7a7a7;
            font-size: 11px;
            letter-spacing: 0.7px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .snapshot-chip strong {
            color: #ffffff;
            font-size: 13px;
            line-height: 1.3;
        }

        .checkout-note {
            margin: 0 0 12px;
            padding: 12px 14px;
            border-radius: 10px;
            background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03));
            border: 1px solid rgba(255,255,255,0.08);
            color: #e8e8e8;
            font-size: 13px;
            line-height: 1.45;
        }

        .order-summary {
            position: sticky;
            bottom: 0;
            backdrop-filter: blur(10px);
        }

        .order-actions {
            position: sticky;
            bottom: 12px;
            z-index: 2;
            padding-bottom: 4px;
        }

        .checkout-btn {
            box-shadow: 0 10px 24px rgba(255,255,255,0.08);
        }

        @media (max-width: 1120px) {
            .featured-strip {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 760px) {
            .order-snapshot {
                grid-template-columns: 1fr;
            }

            .featured-card {
                grid-template-columns: 92px 1fr;
            }

            .featured-card img {
                width: 92px;
                height: 72px;
            }
        }

        .category-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            padding: 0 0 10px;
            flex-shrink: 0;
            justify-content: flex-start;
        }
        .cat-tab {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 6px 14px;
            border-radius: 2px;
            cursor: pointer;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            transition: all 0.2s;
            color: #d6d6d6;
            font-family: 'Poppins', sans-serif;
        }
        .cat-tab:hover, .cat-tab.active {
            background: linear-gradient(180deg, #d7d7d7 0%, #9d9d9d 100%);
            color: #121212;
            border-color: #f3f3f3;
        }
        .admin-btn {
            background: #1f1f1f;
            color: #f5f5f5;
            border: 1px solid #5b5b5b;
            border-radius: 4px;
            padding: 7px 14px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .admin-btn:hover { background: #323232; }
        .logout-btn {
            background: linear-gradient(180deg,#c85b5b,#a43a3a);
            color: #fff;
            border: 1px solid #7a2a2a;
            border-radius: 4px;
            padding: 7px 14px;
